<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis mantenimientos - AutoMotriz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-negro">
      <div class="container">
        <a class="navbar-brand" href="index.html">Auto<span class="text-rojo">Motriz</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav ms-auto" id="menu"></ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-5 flex-grow-1">

    <div class="card shadow-sm mb-4">
      <div class="card-header bg-negro text-white">
        <h1 class="h5 mb-0">Mi perfil</h1>
      </div>
      <div class="card-body" id="perfil"></div>
    </div>

    <div class="card shadow-sm">
      <div class="card-header bg-negro text-white d-flex justify-content-between align-items-center">
        <h2 class="h5 mb-0">Mis mantenimientos</h2>
        <a href="solicitud.html" class="btn btn-rojo btn-sm">Nueva solicitud</a>
      </div>
      <div class="card-body">
        <div id="sinRegistros" class="alert alert-secondary d-none">Aún no tienes solicitudes registradas.</div>
        <div class="table-responsive">
          <table class="table table-striped align-middle">
            <thead>
              <tr>
                <th>ID</th>
                <th>Placa</th>
                <th>Vehículo</th>
                <th>Servicio</th>
                <th>Fecha y hora</th>
                <th>Estado</th>
              </tr>
            </thead>
            <tbody id="tablaMantenimientos"></tbody>
          </table>
        </div>
      </div>
    </div>

  </main>

  <footer class="py-3 mt-auto">
    <div class="container text-center">
      <small>&copy; 2026 AutoMotriz. Todos los derechos reservados.</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/datos.js"></script>
  <script src="js/autenticacion.js"></script>
  <script src="js/cliente.js"></script>
</body>
</html>
