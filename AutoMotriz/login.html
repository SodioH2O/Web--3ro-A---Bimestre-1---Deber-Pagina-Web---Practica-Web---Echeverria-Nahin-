<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión - AutoMotriz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-negro">
      <div class="container">
        <a class="navbar-brand" href="index.html">Auto<span class="text-rojo">Motriz</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav ms-auto" id="menu"></ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-5 flex-grow-1">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
          <div class="card-header bg-negro text-white">
            <h1 class="h4 mb-0">Iniciar sesión</h1>
          </div>
          <div class="card-body">
            <form id="formLogin" novalidate>
              <div class="mb-3">
                <label for="usuario" class="form-label">Usuario</label>
                <input type="text" id="usuario" class="form-control" autocomplete="username">
              </div>
              <div class="mb-3">
                <label for="clave" class="form-label">Contraseña</label>
                <input type="password" id="clave" class="form-control" autocomplete="current-password">
              </div>
              <button type="submit" class="btn btn-rojo w-100">Ingresar</button>
            </form>
          </div>
          <div class="card-footer small text-muted">
            <strong>Cuentas de prueba:</strong><br>
            admin / admin123 (Administrador)<br>
            juan / juan123 y maria / maria123 (Clientes)<br>
            pedro / pedro123 (cuenta deshabilitada)
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-3 mt-auto">
    <div class="container text-center">
      <small>&copy; 2026 AutoMotriz. Todos los derechos reservados.</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/datos.js"></script>
  <script src="js/autenticacion.js"></script>
</body>
</html>
